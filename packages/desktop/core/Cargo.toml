[package]
name = "navvied-desktop-core"
version = "0.3.7"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Starts, watches and stops the navvied program inside the desktop app. No window code lives here."

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[[bin]]
name = "fake-sidecar"
path = "src/bin/fake-sidecar.rs"
test = false

[[bin]]
name = "supervisor-harness"
path = "src/bin/supervisor-harness.rs"
test = false

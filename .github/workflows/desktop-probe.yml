name: desktop-probe
on:
  push:
    tags: ["probe-*"]
  workflow_dispatch:
    inputs:
      rounds:
        description: Disk images to make, per state of the storage daemon
        default: "12"
jobs:
  dmg:
    if: ${{ github.repository == 'navvied/navvied-agent' }}
    name: disk images (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Who holds a new disk image, with the storage daemon as it is, stopped and removed
        env:
          ROUNDS: ${{ inputs.rounds || '12' }}
        run: bash packages/desktop/scripts/ci-run.sh "disk image probe" bash packages/desktop/scripts/dmg-probe.sh "$ROUNDS"

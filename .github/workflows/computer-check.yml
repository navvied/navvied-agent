name: computer-check
# Not part of any release. Runs the pinned screen driver for real on each system's runner: fetches it (hash and signature checked), starts it the
# way the app does, and writes what it offers and what it says about the programs on the machine as one annotation (see
# packages/cli/src/computer-use/check.ts). Started from the Actions tab, or by pushing a tag named computer-<anything> (read the annotations,
# then delete the tag). No input is sent to any program.
on:
  push:
    tags: ["computer-*"]
  workflow_dispatch:
jobs:
  driver:
    if: ${{ github.repository == 'navvied/navvied-agent' }}
    name: driver (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: A virtual screen and the accessibility bus (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils libxtst6 libxi6 libatspi2.0-0 at-spi2-core libatk-adaptor dbus-x11 python3-gi gir1.2-gtk-3.0
      - name: Fetch the driver, start it, list what it offers, read one open program
        timeout-minutes: 10
        run: |
          cmd=(bash packages/desktop/scripts/computer-drive.sh "$RUNNER_TEMP/report.txt")
          [ "$RUNNER_OS" = Linux ] && cmd=(xvfb-run -a dbus-run-session -- "${cmd[@]}")
          bash packages/desktop/scripts/ci-run.sh "driver check" "${cmd[@]}"
      - name: What the driver said
        if: always()
        run: |
          source packages/desktop/scripts/ci-annotate.sh
          # One annotation holds about four thousand characters, so the report goes out in pieces, each cut at the end of a line.
          if [ -f "$RUNNER_TEMP/report.txt" ]; then
            python3 - "$RUNNER_TEMP/report.txt" "$RUNNER_TEMP" <<'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          part, size, chunk = 0, 3500, ""
          for line in text.splitlines(keepends=True):
              if len(chunk) + len(line) > size and chunk:
                  open(f"{sys.argv[2]}/part.{part:02d}", "w").write(chunk); part += 1; chunk = ""
              chunk += line[:size]
          open(f"{sys.argv[2]}/part.{part:02d}", "w").write(chunk)
          PY
            for f in "$RUNNER_TEMP"/part.*; do annotate notice "driver check on ${{ matrix.os }} ${f##*.}" "$f"; done
          else echo "no report was written"; fi
